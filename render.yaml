services:
  - type: web
    name: imcc-website
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    disk:
      name: imcc-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: HOST
        value: "0.0.0.0"
      - key: DATA_DIR
        value: /data
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@imanimining.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: IMCC Management
